data:
- URI: becquerel
  prefLabel_fr: becquerel
  prefLabel_en: becquerel
  Symbol: Bq
  hasDefiningResolution: CGPM15-Res8
  UnitOfQtyKind: ARRN
  inBaseSIUnits:
    - [second, "-1"]
  hasDefiningEquation: 1\;{@becs@} = \frac{@hfcv@}{@hfcs@}
- URI: coulomb
  prefLabel_fr: coulomb
  prefLabel_en: coulomb
