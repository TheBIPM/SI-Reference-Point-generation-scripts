  hasDefiningEquation: 1\;{@cous@} = \frac{@elms@}{@elmv@}
- URI: degreeCelsius
  prefLabel_fr: degré Celsius
  prefLabel_en: degree Celsius
  Symbol: ℃
  hasDefiningResolution: CGPM9-Res7
  UnitOfQtyKind: TEMC
  inBaseSIUnits: kelvin
  hasDefiningEquation: 1\;{@ceus@} = \left(\frac{@bolv@}{@bols@}\right) {@kgms@}\;{@mtrs@}^2\;{@secs@}^{-2}
  PrefixRestriction: true
- URI: farad
