<!DOCTYPE html>
<html lang="">
<head>
    <title>Defining Constants</title>
</head>
<body>
    {% extends 'ParentLayout.html' %}
    {% block main %}
    <h1>Defining Constants</h1>
    {% for con in cons %}
        {% if lang == 'en' %}
            <h2><a href="/constant/{{con.eText}}">{{con.eText}}</a></h2>
        {% elif lang == 'fr' %}
            <h2><a href="/constant/{{con.fText}}">{{con.fText}}</a></h2>
        {%  endif %}
    {% endfor %}
{% endblock %}
</body>
</html>
