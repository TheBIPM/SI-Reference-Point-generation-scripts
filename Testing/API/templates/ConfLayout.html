<!DOCTYPE html>
<html lang="language">
<head>
    <title>Conferences</title>
</head>
<body>
    {% extends 'ParentLayout.html' %}
    {% block main %}
        
        {% for Conference in Conferences %}
            <h2>{{Conference.Title}}</h2>
            <i>Date</i>: {{Conference.Date}}
            {% for Resolution in Conference.Resolutions %}
                <p> {{Resolution.Nr}} <a href="{{Resolution.Res_Link}}">{{Resolution.Title}}</a></p>
            {% endfor %}
        {% endfor %}

    {% endblock %}
</body>
</html>
